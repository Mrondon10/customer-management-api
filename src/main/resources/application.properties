# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/customerdb}

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# REST Countries client
quarkus.rest-client.rest-countries.url=https://restcountries.com
quarkus.rest-client.rest-countries.scope=jakarta.inject.Singleton
quarkus.rest-client.rest-countries.read-timeout=10000
quarkus.rest-client.rest-countries.connect-timeout=5000

# HTTP
quarkus.http.port=8080
